<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money</title>
  <meta name="description" content="Personal expense tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="view"></main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="active"><svg class="i"></svg><span>Home</span></button>
      <button data-tab="history"><svg class="i"></svg><span>History</span></button>
      <button data-tab="analytics"><svg class="i"></svg><span>Analytics</span></button>
      <button data-tab="settings"><svg class="i"></svg><span>Settings</span></button>
    </nav>
  </div>
  <div id="hint" hidden></div>
  <div id="sheet" hidden></div>
  <div id="toast" hidden></div>
  <div id="tip" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
